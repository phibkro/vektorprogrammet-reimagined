# Local-only Supabase CLI configuration. Domain migrations use packages/db's Drizzle migrations.
project_id = "vektor-prototype"

[api]
enabled = true
port = 55431
schemas = ["graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55434

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
enable_signup = false
minimum_password_length = 8

[auth.email]
# Keep email/password enabled; the global auth.enable_signup above blocks public registration.
enable_signup = true
enable_confirmations = true

[auth.email.template.invite]
subject = "Aktiver kontoen din"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Tilbakestill passordet ditt"
content_path = "./supabase/templates/recovery.html"
