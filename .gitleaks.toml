title = "vektorprogrammet staged secret and personal-data checks"

[extend]
useDefault = true

[[rules]]
id = "norwegian-national-id"
description = "Norwegian fødselsnummer (11 digits with a valid day/month prefix)"
regex = '\b(?:0[1-9]|[12][0-9]|3[01])(?:0[1-9]|1[0-2])[0-9]{7}\b'
secretGroup = 0
keywords = ["fødselsnummer", "fodselsnummer", "national id", "personnummer"]

[[rules]]
id = "norwegian-bank-account"
description = "Norwegian bank account number in an explicit account field"
regex = '(?i)(?:kontonummer|bankkonto|bank[_ -]?account|account[_ -]?number)\s*[:=]\s*[0-9]{11}'
secretGroup = 0
keywords = ["kontonummer", "bankkonto", "account"]

[[rules]]
id = "norwegian-iban"
description = "Norwegian IBAN"
regex = '\bNO[0-9]{2}[0-9]{11}[A-Z0-9]{4}\b'
secretGroup = 0
keywords = ["NO"]

[[rules]]
id = "sql-user-row"
description = "SQL dump inserts into a user or person table"
regex = '(?i)INSERT\s+INTO\s+\x60?(?:user|users|person|persons|account|accounts)\x60?\s*\([^;]{1,500}\)\s*VALUES'
secretGroup = 0
keywords = ["insert", "into"]

[allowlist]
description = "Only the local devenv SELECT-only MySQL placeholder password (legacy_reader) in devenv.nix; both the file and the value must match, so a real secret elsewhere in that file is still reported."
condition = "AND"
paths = ['''^devenv\.nix$''']
regexes = ['''^legacy_reader$''']
