title = "vektorprogrammet staged secret and personal-data checks"

[extend]
useDefault = true

[[rules]]
id = "norwegian-national-id"
description = "Norwegian fødselsnummer (11 digits with a valid day/month prefix)"
regex = '\b(?:0[1-9]|[12][0-9]|3[01])(?:0[1-9]|1[0-2])[0-9]{7}\b'
secretGroup = 0
keywords = ["fødselsnummer", "fodselsnummer", "national id", "personnummer"]

[[rules]]
id = "norwegian-bank-account"
description = "Norwegian bank account number in an explicit account field"
regex = '(?i)(?:kontonummer|bankkonto|bank[_ -]?account|account[_ -]?number)\s*[:=]\s*[0-9]{11}'
secretGroup = 0
keywords = ["kontonummer", "bankkonto", "account"]

[[rules]]
id = "norwegian-iban"
description = "Norwegian IBAN"
regex = '\bNO[0-9]{2}[0-9]{11}[A-Z0-9]{4}\b'
secretGroup = 0
keywords = ["NO"]

[[rules]]
id = "sql-user-row"
description = "SQL dump inserts into a user or person table"
regex = '(?i)INSERT\s+INTO\s+\x60?(?:user|users|person|persons|account|accounts)\x60?\s*\([^;]{1,500}\)\s*VALUES'
secretGroup = 0
keywords = ["insert", "into"]

[[rules.allowlists]]
description = "Only the exact parameterized, example.org-only account fixtures; no other SQL-user-row match is exempt."
condition = "AND"
paths = ['''^apps/web/test/auth\.postgres\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*yield\* sql\x60insert into person \(id, name, email, email_verified, field_of_study_id\) values \(\$\{id\}, \$\{state\}, \$\{email\}, true, 101\)\x60;$''',
  '''^\s*yield\* sql\x60insert into account \(person_id, state\) values \(\$\{id\}, \$\{state\}\)\x60;$''',
]

[[rules.allowlists]]
description = "Only the exact fixed and parameterized example.org people in the code-delivery test."
condition = "AND"
paths = ['''^apps/web/test/codeDelivery\.postgres\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(201, 'Leader', 'leader@example\.org', 201\), \(202, 'Invitee', 'invitee@example\.org', 201\)\x60;$''',
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{personId\}, 'Invitee', \$\{email\}, \$\{LEADER\}\)\x60;$''',
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{LEADER\}, 'Leader', 'retryleader@example\.org', \$\{LEADER\}\) on conflict do nothing\x60;$''',
]

[[rules.allowlists]]
description = "Only the exact example.org-only people and Active account of the code lifecycle test."
condition = "AND"
paths = ['''^apps/web/test/codeLifecycle\.postgres\.test\.ts$''']
regexTarget = "line"
regexes = [
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{LEADER\}, 'Leader', 'kodelcleader@example\.org', \$\{DEPARTMENT\}\) on conflict do nothing\x60;$''',
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{id\}, 'Person', \$\{emailOf\(id\)\}, \$\{DEPARTMENT\}\)\x60;$''',
  '''^\s*yield\* sql\x60insert into account \(person_id, state\) values \(\$\{id\}, 'Active'\)\x60;$''',
]

[[rules.allowlists]]
description = "The same three example.org fixture lines in the one earlier commit that held the file as `.wip` (the history scan reads it); that commit and that path only. Retire this entry when the remote branch feat/code-delivery-after-commit (the only ref that holds the commit) is deleted (spec 0024 R4)."
condition = "AND"
commits = ["5d8f76a4425c2627708cb78f1e7314a19c5cb6ab"]
paths = ['''^apps/web/test/codeLifecycle\.postgres\.test\.ts\.wip$''']
regexTarget = "line"
regexes = [
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{LEADER\}, 'Leader', 'kodelcleader@example\.org', \$\{DEPARTMENT\}\) on conflict do nothing\x60;$''',
  '''^\s*yield\* sql\x60insert into person \(id, name, email, field_of_study_id\) values \(\$\{id\}, 'Person', \$\{emailOf\(id\)\}, \$\{DEPARTMENT\}\)\x60;$''',
  '''^\s*yield\* sql\x60insert into account \(person_id, state\) values \(\$\{id\}, 'Active'\)\x60;$''',
]

[allowlist]
description = "Only the local devenv SELECT-only MySQL placeholder password (legacy_reader) in devenv.nix; both the file and the value must match, so a real secret elsewhere in that file is still reported."
condition = "AND"
paths = ['''^devenv\.nix$''']
regexes = ['''^legacy_reader$''']
