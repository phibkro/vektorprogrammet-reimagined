[project]
name = "vektorprogrammet"
revision = "1.0"

# Declarations only: values live in each developer's provider (`secretspec set NAME`), never in the repo.
# Use at runtime: `secretspec run -- <command>`, so values never pass through devenv evaluation or the Nix store.

[profiles.default]
NEON_API_KEY = { description = "Neon API key for neonctl: project, branch and role management. Operator tooling only; never deployed to a Worker.", required = true }
NEON_APP_PASSWORD = { description = "Password of the least-privilege Neon role vp_app (DML only; created in SQL so it is not in neon_superuser). Hyperdrive connects as this role. Generated by tooling, rotate with ALTER ROLE.", required = true }
NEON_EMDASH_PASSWORD = { description = "Password of the Neon role emdash_app, which owns schema emdash (apps/cms/db/emdash-role.sql). The CMS's Hyperdrive connects as this role. Rotate with ALTER ROLE.", required = true }
EMDASH_ENCRYPTION_KEY = { description = "EmDash's encryption key (bunx emdash secrets generate). The same value for local runs against Neon and for the deployed CMS Workers.", required = true }
CMS_READ_TOKEN = { description = "EmDash personal access token with scopes content:read and media:read; apps/web reads published content with it.", required = true }
