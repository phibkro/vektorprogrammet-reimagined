name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        shell: bash
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Start devenv PostgreSQL and MySQL
        shell: bash
        run: devenv up --detach
      - name: Install workspace dependencies and prepare editor/hooks
        shell: bash
        run: devenv shell -- bun install --frozen-lockfile
      - name: Wait for database services
        shell: bash
        run: |
          devenv shell -- bash -euo pipefail -c '
            until pg_isready --host 127.0.0.1 --port "${PGPORT}"; do sleep 1; done
            mysql_port="$(bun -e "console.log(new URL(process.env.LEGACY_MYSQL_URL).port)")"
            until MYSQL_PWD=legacy_reader mysqladmin ping --silent --host 127.0.0.1 --port "$mysql_port" --user legacy_reader; do sleep 1; done
          '
      - name: Vite+ checks
        shell: bash
        run: devenv shell -- bunx vp check
      - name: Effect exception registry
        shell: bash
        run: devenv shell -- bun run check:exceptions
      - name: Module graph
        shell: bash
        run: devenv shell -- bun run check:module-graph
      - name: Generated documentation
        shell: bash
        run: devenv shell -- bun run check:docs
      - name: Workspace tests
        shell: bash
        run: devenv shell -- bun run test:all
      - name: Browser tests
        id: browser
        shell: bash
        # A run takes 2 to 3 minutes. The limit makes a run that passes its tests and then never exits fail the
        # step, instead of holding the job for the 6-hour default.
        timeout-minutes: 15
        run: devenv shell -- bun run e2e
      # Playwright keeps a trace and a screenshot only for a failing test (e2e/playwright.config.ts). They contain only
      # the disposable stack's test data and links. Retain them briefly for diagnosis (issues #39, #40).
      - name: Upload browser failure evidence
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Run the CMS bundle in workerd
        shell: bash
        run: devenv shell -- bun run check:cms
      - name: Knip
        shell: bash
        run: devenv shell -- bun run knip
      - name: Copy-paste detection
        shell: bash
        run: devenv shell -- bun run cpd
      - name: Full-history secret and personal-data scan
        shell: bash
        run: devenv shell -- gitleaks git --config .gitleaks.toml --redact
